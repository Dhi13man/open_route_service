name: Bug report
description: Report reproducible behavior that differs from the documented API.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys or other credentials. Report vulnerabilities through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.2.7
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample and steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Dart or Flutter version and operating system.
    validations:
      required: true
