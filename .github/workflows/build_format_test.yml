# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build, Format, Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_format_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2

      - name: Install dependencies
        run: dart pub get

      # Verify the use of 'dart format' on each commit.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Validate package publication
        run: dart pub publish --dry-run

      - name: Run deterministic tests
        if: github.actor == 'dependabot[bot]'
        run: dart test test/open_route_service_test.dart --name 'GeoJSON'

      # Repository secrets are intentionally unavailable to Dependabot pull requests.
      - name: Run API integration tests
        if: github.actor != 'dependabot[bot]'
        run: dart test
        env:
          EXEC_ENV: 'github_actions'
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
