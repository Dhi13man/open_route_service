# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build, Format, Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_format_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pin the SDK that was green with setup-dart 1.8.0. setup-dart 1.8.1
      # otherwise installs latest stable, which fails dart analyze --fatal-infos.
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2

      - name: Install dependencies
        run: dart pub get

      # Verify the use of 'dart format' on each commit.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Validate package publication
        run: dart pub publish --dry-run

      - name: Detect whether this pull request is docs-only
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          CHANGED="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '\.(md|MD)$|^\.github/'; then
            echo "skip_live=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_live=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deterministic tests
        if: github.actor == 'dependabot[bot]' || steps.changes.outputs.skip_live == 'true'
        run: dart test test/open_route_service_test.dart --name 'GeoJSON'

      # Repository secrets are intentionally unavailable to Dependabot pull requests.
      # Live OpenRouteService calls are skipped for docs/.github-only PRs so community
      # file changes are not blocked by third-party API timeouts.
      - name: Run API integration tests
        if: github.actor != 'dependabot[bot]' && steps.changes.outputs.skip_live != 'true'
        run: dart test
        env:
          EXEC_ENV: 'github_actions'
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
